name: Vendor libraries
# Downloads the libraries listed in vendor/sources.txt ("<path> <url>") into the site. Runs when the list changes.
on:
  push:
    paths: ['vendor/sources.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          grep -v '^#' vendor/sources.txt | while read -r path url; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -fsSL "$url" -o "$path"
            echo "$path $(stat -c %s "$path") bytes"
          done
      - name: Save to repository
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add vendor
          git diff --cached --quiet || git commit -m "Vendor libraries (pdf.js)"
          git push

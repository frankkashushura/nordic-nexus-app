<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com; media-src 'self' blob: https://*.supabase.co; frame-src 'none'; object-src 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js?v=71"></script>
<script src="vendor/supabase.js"></script>
<script src="nexus-sb.js?v=71"></script>
<script src="nexus-chat.js?v=71"></script>
</head><body>
<title>NORDIC NEXUS</title>
<meta name="theme-color" content="#182340">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#E4E2DC; --panel:#FCFCFA; --panel2:#F1EFEA; --ink:#182340; --muted:#56607A; --line:#D3CFC6;
  --steel:#182340; --steel-ink:#E8EDF6; --steel-muted:#8E9AB8; --steel-line:#27345A;
  --accent:#539FDC; --accent-ink:#0E1830; --accent-soft:#DCEBF8;
  --amber:#F2A900; --amber-ink:#182340; --amber-soft:#FBEBC0;
  --blue:#2F6DB5; --blue-soft:#DDE8F5;
  --good:#2E7D4F; --good-soft:#D9EDE0; --warn:#9A6500; --warn-soft:#F8E8C0; --bad:#B8402A; --bad-soft:#F6DCD5;
  --shadow:0 1px 2px rgba(24,35,64,.07),0 4px 14px rgba(24,35,64,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1425; --panel:#162038; --panel2:#1D2845; --ink:#E6EBF5; --muted:#98A3BE; --line:#2A3656;
  --steel:#0A0F1D; --steel-ink:#E6EBF5; --steel-muted:#7F8BA8; --steel-line:#1C2745;
  --accent:#6DB2EA; --accent-ink:#0A0F1D; --accent-soft:#1A3350;
  --amber:#F2B632; --amber-ink:#0A0F1D; --amber-soft:#3A2E10;
  --blue:#86B3E8; --blue-soft:#1B2C49;
  --good:#5FBF86; --good-soft:#15301F; --warn:#E6B24B; --warn-soft:#352A12; --bad:#E57A60; --bad-soft:#3A1E17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1425; --panel:#162038; --panel2:#1D2845; --ink:#E6EBF5; --muted:#98A3BE; --line:#2A3656;
  --steel:#0A0F1D; --steel-ink:#E6EBF5; --steel-muted:#7F8BA8; --steel-line:#1C2745;
  --accent:#6DB2EA; --accent-ink:#0A0F1D; --accent-soft:#1A3350;
  --amber:#F2B632; --amber-ink:#0A0F1D; --amber-soft:#3A2E10;
  --blue:#86B3E8; --blue-soft:#1B2C49;
  --good:#5FBF86; --good-soft:#15301F; --warn:#E6B24B; --warn-soft:#352A12; --bad:#E57A60; --bad-soft:#3A1E17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase}
h3{font-size:17px}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--steel);color:var(--steel-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,#182340 12px 24px);flex:none}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.mark{width:46px;height:34px;flex:none;display:grid;place-items:center;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain}
.mark img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font:700 20px/1 var(--f-display);letter-spacing:.04em;white-space:nowrap}
.brand span{display:block;margin-top:3px;font-size:9.5px;line-height:1.3;color:var(--steel-muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;padding:6px 10px 16px;gap:1px}
.nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel-muted);padding:14px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--steel-ink);font-size:13.5px}
.nav button:hover{background:var(--steel-line)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.nav .cnt{margin-left:auto;font:500 11px var(--f-mono);background:var(--bad);color:#fff;border-radius:9px;padding:0 6px}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--steel-line);font-size:11px;color:var(--steel-muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
.top .ttl{min-width:0}
.top .ttl .label{display:block}
.top h1{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{all:unset;cursor:pointer;position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font:600 10px/16px var(--f-mono);min-width:16px;height:16px;border-radius:8px;text-align:center;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.av{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:12px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.view{padding:22px 24px 90px;display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--blue-soft);color:var(--ink);font-size:13px}
.banner.warn{background:var(--warn-soft)}
.banner b{font-weight:600}

/* components */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ai>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--accent-soft);flex-wrap:wrap}
.ai>.hd h2{font-size:17px}.ai>.hd .sp{flex:1}
.ai>.bd{padding:14px 16px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h2{font-size:17px}
.card>.hd .sp{flex:1}
.card>.bd{padding:14px 16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(160px,45%),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative}
.kpi .v{font:600 30px/1 var(--f-display);letter-spacing:.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hot{border-top:3px solid var(--bad)}
.kpi.amb{border-top:3px solid var(--amber)}
.kpi.blu{border-top:3px solid var(--blue)}
.kpi.grn{border-top:3px solid var(--good)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.amb{background:var(--amber-soft);color:var(--warn)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.days{font:600 12px var(--f-mono);padding:2px 7px;border-radius:4px;white-space:nowrap}
.days.bad{background:var(--bad);color:#fff}
.days.warn{background:var(--amber);color:var(--amber-ink)}
.days.good{background:var(--good-soft);color:var(--good)}
.days.gone{background:var(--panel2);color:var(--muted);text-decoration:line-through}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
.inp,select.inp,textarea.inp{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:0;width:100%}
textarea.inp{min-height:84px;resize:vertical}
.toolbar .inp{width:auto}
.search{min-width:min(260px,100%)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}
.li.nt-new .ttl2,.li.nt-unread .ttl2{font-weight:700}
.li.nt-read{opacity:.62}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
td.r,th.r{text-align:right}
.ttl2{font-weight:600;line-height:1.35}
.sub{font-size:12px;color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.stripe{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--line)}
.stripe.bad{background:var(--bad)}.stripe.warn{background:var(--amber)}.stripe.good{background:var(--good)}.stripe.blue{background:var(--blue)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--panel2);cursor:zoom-in}
.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:14px}
.staff{padding:16px;display:flex;flex-direction:column;gap:10px}
.staff .ph{width:64px;height:64px;border-radius:6px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font:700 24px var(--f-display);overflow:hidden}
.staff .ph img{width:100%;height:100%;object-fit:cover}
.ai{border:1px solid var(--accent);background:linear-gradient(0deg,var(--panel),var(--panel)),var(--accent-soft);border-radius:var(--r)}
.ai .hd{border-bottom-color:var(--accent-soft)}
.ai-tag{font:600 10.5px var(--f-mono);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:3px}
.prose{white-space:pre-wrap;line-height:1.6}
.verdict{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.verdict .big{font:700 34px/1 var(--f-display);text-transform:uppercase}
.verdict .big.good{color:var(--good)}.verdict .big.warn{color:var(--warn)}.verdict .big.bad{color:var(--bad)}
ul.clean{margin:4px 0 0;padding-left:18px}
ul.clean li{margin:3px 0}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--panel2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.blueprint{background-color:var(--steel);background-image:linear-gradient(rgba(127,168,209,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(127,168,209,.12) 1px,transparent 1px);background-size:22px 22px;color:var(--steel-ink);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.blueprint h2{font-size:28px;color:var(--steel-ink)}
.blueprint .muted{color:var(--steel-muted)}
.blueprint .btn{background:transparent;color:var(--steel-ink);border-color:var(--steel-muted)}
.blueprint .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.phase{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .n{font:700 26px/1 var(--f-display);color:var(--accent)}
.chart svg{display:block;width:100%;height:auto}

/* overlays */
.drawer-bg{position:fixed;inset:0;background:rgba(12,17,21,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer>.dh{position:sticky;top:0;z-index:2;background:var(--steel);color:var(--steel-ink);padding:14px 18px calc(14px);padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:flex-start}
.drawer>.dh h2{color:var(--steel-ink);font-size:20px;text-transform:none;flex:1}
.drawer>.dh .iconbtn{background:transparent;border-color:var(--steel-line);color:var(--steel-ink)}
.drawer>.db{padding:18px;display:flex;flex-direction:column;gap:16px}
.drawer>.df{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:80;font-size:13px;box-shadow:var(--shadow)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:90;display:grid;place-items:center;padding:20px}
.lightbox img{max-height:90vh;max-width:100%;border-radius:4px}
.confirm{position:fixed;inset:0;z-index:95;background:rgba(12,17,21,.5);display:grid;place-items:center;padding:16px}
.confirm .card{max-width:420px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px}


/* weekly report */
.prose-rep h3{font:700 16px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--accent);padding-bottom:4px;margin-top:8px}
.prose-rep p{line-height:1.6}
.prose-rep table{margin:4px 0}
/* home */
.home-hero{position:relative;overflow:hidden;border-radius:var(--r);background:#182340;color:#fff;min-height:clamp(420px,62vh,560px);display:flex;isolation:isolate}
.hh-photo{position:absolute;inset:0 0 0 38%;background:url("img/tower.jpg") center 30%/cover no-repeat;z-index:-2}
.hh-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#182340 0%,rgba(24,35,64,.55) 22%,rgba(24,35,64,0) 55%)}
.hh-diamond{position:absolute;width:190px;height:190px;transform:rotate(45deg);z-index:-1;border-radius:14px}
.hh-diamond.d1{left:47%;bottom:-110px;background:#539FDC}
.hh-diamond.d2{left:57%;bottom:-150px;width:150px;height:150px;background:#182340;border:6px solid #fff}
.hh-diamond.d3{right:-60px;top:-60px;width:170px;height:170px;background:rgba(83,159,220,.85)}
.hh-text{position:relative;padding:clamp(22px,4vw,44px);max-width:620px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hh-brand{display:flex;align-items:center;gap:12px}
.hh-brand img{height:42px;width:auto}
.hh-brand span{font:600 11.5px/1.35 var(--f-body);letter-spacing:.1em;color:#E8EDF6}
.hh-brand em{font-style:normal;font-weight:400;letter-spacing:.02em;color:#9FB0CF}
.hh-eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9FC7EC}
.hh-title{font:700 clamp(54px,9vw,104px)/.88 var(--f-display);letter-spacing:.02em;color:#fff;text-transform:uppercase}
.hh-title span{color:#539FDC}
.hh-slogan{font:600 clamp(22px,2.6vw,30px)/1.15 var(--f-display);letter-spacing:.02em;color:#fff;border-left:4px solid #539FDC;padding-left:12px}
.hh-sub{font-size:15px;color:#C9D4E8;max-width:44ch}
.home-hero .btn.pri{background:#539FDC;border-color:#539FDC;color:#0E1830}
.home-hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.hh-status{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:#C9D4E8;border-top:1px solid rgba(255,255,255,.15);padding-top:12px;align-items:center}
.hh-status b{color:#fff;font-size:15px}
.home-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,46%),1fr));gap:12px}
.tile{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .ti{grid-row:1/3;width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--blue);display:grid;place-items:center}
.tile .ti svg{width:20px;height:20px}

/* ---------- data writes ---------- */
function needDb(){ if(!db){ toast('Saving needs the NEXUS database, which is not available in this view.'); return false;} return true; }
async function put(col, id, data){ if(!needDb()) return null; id=id||uid(); try{ await db.doc(col+'/'+id).set({...data, updated_at:new Date().toISOString(), updated_by:me.name||''}); return id; } catch(e){ handleErr(e); return null; } }
async function patch(col, id, data){ if(!needDb()) return; try{ await db.doc(col+'/'+id).update({...data, updated_at:new Date().toISOString(), updated_by:me.name||''}); } catch(e){ handleErr(e); } }
async function remove(col, id){ if(!needDb()) return; try{ await db.doc(col+'/'+id).delete(); } catch(e){ handleErr(e); } }
function handleErr(e){
  const c=e?.code;
  if(c==='invalid_argument'){ toast('You do not have permission to change this. Ask an administrator.'); }
  else if(c==='quota_exceeded'){ toast('Storage is full. Delete old records or photos, then try again.'); }
  else { toast('Could not save: '+(e?.message||'unknown error')+'. Try again.'); }
  console.warn(e);
}
async function logAct(text){
  if(!db) return;
  const key = new Date().toISOString().slice(0,7);
  const ref = db.doc('activity/'+key);
  try{
    const snap = await ref.get();
    const entries = (snap.exists ? (snap.data().entries||[]) : []).slice(-299);
    entries.push({at:new Date().toISOString(), who:me.name||'Someone', text});
    await ref.set({entries});
  }catch(e){ console.warn(e); }
}

/* ---------- photos: assets store, with database fallback ---------- */
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{res(i)}; i.onerror=rej; i.src=u; }); }
async function shrink(file, max, q){
  const img = await loadImg(file); const r = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return { blob: await new Promise(r=>c.toBlob(r,'image/jpeg',q)), dataUrl: c.toDataURL('image/jpeg',q) };
}
async function storePhoto(file){
  if(assets){
    try{ const {blob} = await shrink(file,1800,.82); const r = await assets.upload(blob,{type:'image/jpeg'}); return 'asset:'+r.url; }
    catch(e){ console.warn('asset upload failed, using database', e); }
  }
  if(!db) throw new Error('no storage');
  let s = await shrink(file,1100,.7); if(s.dataUrl.length>240000) s = await shrink(file,800,.6);
  const id = uid(); await db.doc('photos/'+id).set({data:s.dataUrl, at:new Date().toISOString()}); return 'db:'+id;
}
const photoCache = {};
function photoTag(ref, cls=''){
  if(!ref) return '';
  if(ref.startsWith('asset:')) return `<img class="${cls}" alt="Photo" loading="lazy" src="${esc(ref.slice(6))}" data-zoom>`;
  const id = ref.slice(3);
  if(photoCache[id]) return `<img class="${cls}" alt="Photo" src="${photoCache[id]}" data-zoom>`;
  if(db && photoCache[id]===undefined){ photoCache[id]=null; db.doc('photos/'+id).get().then(s=>{ photoCache[id]=s.exists?s.data().data:''; renderAll(); }).catch(()=>{}); }
  return `<img class="${cls}" alt="Photo loading">`;
}

/* ---------- alerts engine (computed live, no manual work) ---------- */
function openTenders(){ return S.tenders.filter(t => { const d=daysLeft(t.deadline); return d!=null && d>0 && !/closed|cancel|won|lost|submitted/i.test(t.status||''); }); }
const firstSeen=t=>t.found_at||t.date_found||t.imported_at||'';
function computeAlerts(){
  const A=[];
  openTenders().forEach(t=>{
    const d=daysLeft(t.deadline);

    if(t.screen!=='Drop' && d<=7) A.push({lvl:d<=3?'bad':'warn', kind:(f!=null&&f>-2)?'New tender':'Tender deadline', text:`${t.title}`, sub:`${t.client||''} · closes ${fmtDT(t.deadline)}`, go:['tender',t.id], sort:d, at:atMinus(t.deadline,7)}); if(f!=null && f>-2 && t.screen!=='Drop' && !(d<=7)) A.push({lvl:'blue', kind:'New tender', text:t.title, sub:`${t.client||''} · ${t.screen||''} · found ${fmtD(t.date_found)}`, go:['tender',t.id], sort:50, at:firstSeen(t)});
  });
  if(typeof recAlerts==='function') recAlerts(A);
  S.procurement.filter(p=>p.status==='Requested').forEach(p=>A.push({lvl:'warn', kind:'Approval needed', text:`Purchase request: ${p.item}`, sub:`${projName(p.project_id)} · ${tzs(p.est_cost)}`, go:['route','procure'], sort:20, at:p.requested_at||p.updated_at}));
  // meetings I am invited to / organising
  { const sid=myStaffId(), now=Date.now(); (S.meetings||[]).filter(m=>m.status!=='Cancelled'&&meetEnd(m)>now&&((sid&&(m.invitees||[]).includes(sid))||m.organizer_uid===me.id)).forEach(m=>{ const t=meetStart(m), inv=sid&&(m.invitees||[]).includes(sid), ans=inv?(m.responses||{})[sid]:null;
    if(t-now<=864e5) A.push({lvl:t-now<=36e5?'warn':'blue', kind:'Meeting', text:`${m.title}`, sub:`${t<=now?'Happening now':'Starts '+fmtDT(m.start_iso)}${m.venue?' · '+m.venue:''}`, go:['route','meetings'], sort:t-now<=36e5?4:12, at:new Date(t-864e5).toISOString()});
    else if(inv&&!ans) A.push({lvl:'blue', kind:'Meeting invite', text:m.title, sub:`${fmtDT(m.start_iso)} · from ${m.organizer||''} – please confirm`, go:['route','meetings'], sort:25, at:m.created_at||m.updated_at}); }); }
  // feedback to the person who raised a purchase request (last 7 days)
  S.procurement.filter(p=>p.status!=='Requested' && !p.example && (p.requested_uid?p.requested_uid===me.id:(p.requested_by&&p.requested_by===me.name))).forEach(p=>{
    const at=p.status==='Delivered'?p.delivered_at:p.status==='Ordered'?p.ordered_at:p.approved_at, by=p.status==='Delivered'?p.delivered_by:p.status==='Ordered'?p.ordered_by:p.approved_by;
    if(!at || Date.now()-Date.parse(at)>7*864e5) return;
    A.push({lvl:p.status==='Rejected'?'bad':'blue', kind:'Your purchase', text:`${p.pr_no||''} ${p.item} – ${p.status.toLowerCase()}`, sub:`${by?'by '+by+' · ':''}${fmtDT(at)}`, go:['route','procure'], sort:15, at});
  });
  S.compliance.forEach(c=>{ const d=daysLeft(c.expiry); if(d!=null && d<=45) A.push({lvl:d<0?'bad':d<=14?'bad':'warn', kind:'Compliance', text:`${c.name} ${d<0?'has expired':'expires '+fmtD(c.expiry)}`, sub:'Renew before tendering', go:['route','docs'], sort:d, at:atMinus(c.expiry,45)}); });
  { const sid=myStaffId(); S.tasks.filter(t=>tStage(t)!=='Done'&&sid&&t.assignee===sid).forEach(t=>{
      if(t.assigned_at&&Date.now()-Date.parse(t.assigned_at)<3*864e5) A.push({lvl:'blue', kind:'Task for you', text:t.title, sub:`${t.assigned_by?'From '+t.assigned_by+' · ':''}${t.due?'due '+fmtD(t.due):'no due date'}${t.project_id?' · '+projName(t.project_id):''}`, go:['route','tasks'], sort:8, at:t.assigned_at, nk:'task|'+t.id+'|'+sid});
      const dl=t.due?daysLeft(t.due+'T23:59'):null; if(dl!=null&&dl>=0&&dl<2) A.push({lvl:'warn', kind:'Task due', text:t.title, sub:`Due ${dl<1?'today':'tomorrow'} · ${fmtD(t.due)}`, go:['route','tasks'], sort:6, at:new Date(Date.parse(t.due+'T07:00:00+03:00')-864e5).toISOString(), nk:'taskdue|'+t.id+'|'+t.due}); }); }
  S.tasks.filter(t=>tStage(t)!=='Done' && t.due && daysLeft(t.due+'T23:59')<0 && (isAdmin||(myStaffId()&&t.assignee===myStaffId()))).forEach(t=>A.push({lvl:'bad', kind:'Overdue task', text:t.title, sub:`${staffName(t.assignee)} · due ${fmtD(t.due)}`, go:['route','tasks'], sort:5, at:t.due?t.due+'T23:59:00+03:00':''}));
  S.reports.filter(r=>r.hse && r.hse.trim() && !/^(none|nil|no)\b/i.test(r.hse.trim()) && daysLeft(r.date)>-7).forEach(r=>A.push({lvl:'bad', kind:'HSE', text:`HSE note on ${projName(r.project_id)}`, sub:r.hse.slice(0,90), go:['report',r.id], sort:2, at:r.updated_at||r.date}));
  (money()?(S.certificates||[]):[]).forEach(c=>{ if(typeof certState!=='function') return; const st=certState(c); if(st.cls==='bad') A.push({lvl:'bad', kind:'Payment overdue', text:`${c.no} – ${projName(c.project_id)}`, sub:`${tzs(c.amount)} · ${st.label}`, go:['route','certs'], sort:3}); });
  S.tenders.filter(t=>/preparing/i.test(t.status||'')).forEach(t=>{ const d=daysLeft(t.deadline); if(d==null||d<0||d>5||typeof checklistState!=='function') return; const s=checklistState(t); if(s.done<s.total) A.push({lvl:d<=2?'bad':'warn', kind:'Bid not ready', text:t.title, sub:`Checklist ${s.done}/${s.total} · closes ${fmtDT(t.deadline)}`, go:['tender',t.id], sort:d}); });
  if(typeof syncHealth==='function' && S.sync && syncHealth().cls==='bad') A.push({lvl:'bad', kind:'Tender scanning', text:syncHealth().label, sub:'Check the Actions tab of the nordic-tender-scanner repository on GitHub', go:['route','tenders'], sort:1});
  if(isAdmin && window.NX_BACKUP_CARD && S.backup!==undefined){ const bk=S.backup, age=bk&&bk.last_ok?(Date.now()-Date.parse(bk.last_ok))/36e5:1e9; if(age>48||bk?.error) A.push({lvl:'bad', kind:'Backup', text:bk?.error?'The last automatic backup failed':'No backup in the last 2 days', sub:bk?.error?String(bk.error).slice(0,90):'Company & Security → Backups → Back up now', go:['route','settings'], sort:2}); else if(bk?.mail_error) A.push({lvl:'warn', kind:'Backup', text:'Backup saved, but the email copy was not sent', sub:String(bk.mail_error).slice(0,90), go:['route','settings'], sort:6}); }
  if(isAdmin && window.NX_FILES_BK!==undefined && S.backup && (+S.backup.files||0)>0){ const f=window.NX_FILES_BK, fa=f&&f.last_at?(Date.now()-Date.parse(f.last_at))/864e5:1e9; if(fa>7) A.push({lvl:'warn', kind:'Backup', text:f&&f.last_at?`Photos & documents last backed up ${Math.floor(fa)} days ago`:'Photos & documents have never been backed up', sub:'Company & Security → Backups → Download photos & documents (.zip), then save it in Google Drive', go:['route','settings'], sort:7}); }
  if(isAdmin && window.NX_PENDING>0){ const PL=window.NX_PENDING_LIST;
    if(Array.isArray(PL)&&PL.length) PL.forEach(u=>A.push({lvl:'warn', kind:'Access request', text:`${u.name||(u.email||'').split('@')[0]||'Someone'}${u.position?' ('+u.position+')':''} asked to join NEXUS`, sub:'Tap to open Manage logins → choose a role → Approve or Reject', go:['route','logins'], sort:3, at:u.requested_at, nk:'access|'+u.user_id}));
    else A.push({lvl:'warn', kind:'Access request', text:`${window.NX_PENDING} ${window.NX_PENDING>1?'people are':'person is'} waiting for approval`, sub:'Tap to open Manage logins → choose a role → Approve or Reject', go:['route','logins'], sort:3}); }
  { const em=S.sync&&S.sync.email; if(isAdmin&&em){ if(em.configured===false) A.push({lvl:'bad', kind:'Email alerts', text:'Email alerts are not sending – Gmail password missing', sub:'Add SMTP_PASSWORD in Supabase → Edge Functions → Secrets', go:['route','alerts'], sort:4}); else if((em.failed||[]).length) A.push({lvl:'warn', kind:'Email alerts', text:`${em.failed.length} email(s) could not be delivered`, sub:String(em.failed[0]).slice(0,90), go:['route','alerts'], sort:4, at:S.sync.last_sync}); } }
  if(typeof pmAlerts==='function') pmAlerts(A);
  return A.sort((a,b)=>a.sort-b.sort);
}

  const prompt=`You are the bid/no-bid adviser for a Tanzanian contractor.\n${companyContext()}\n\nF-02 method: gates G1 CRB class & category within Nordic's classes, G2 turnover/experience, G3 bid security & performance guarantee within bank limits, G4 deadline achievable. Then 12 criteria scored 0-5 with weights: ${F02.map((c,i)=>`${i+1}. ${c[0]} (${c[1]})`).join('; ')}. Weighted score = sum(weight*score)/5. Bid if >=70, Conditional (MD) if >=50, else No-Bid.\nPublic notices do not show CRB class, value or bid security: mark such gates TBC and list them under verify. Distances: Dar/Coast near; Morogoro, Dodoma, Tanga mid; far regions add logistics cost. Be realistic and specific to this tender. Never invent values.\n\nTENDER:\n${JSON.stringify(facts)}\n\nReply with only JSON: {"verdict":"Bid"|"Conditional (MD)"|"No-Bid","confidence":0-100,"score_estimate":number,"scores":[12 integers 0-5],"gates":[{"gate":"G1 CRB class","status":"Pass"|"Fail"|"TBC","note":"..."},...4],"summary":"2-3 sentences","strengths":["..."],"risks":["..."],"verify":["..."],"next_steps":["..."]}`;
  const r=await ai('tender',()=>sample.json(prompt,{modelTier:'default'}));

const XMAP={'Tender no.':'no','Date found':'date_found','Source':'source','Source URL':'url','Client':'client','Client type':'client_type','Tender title':'title','Scope summary':'scope','Location':'location','Category':'category','CRB class required':'crb','Est. value TZS':'value','Funding confirmed':'funding','Site visit date':'site_visit','Clarification deadline':'clar','Submission date':'deadline','Bid security':'bid_security','Documents purchased':'docs','Status':'status','Owner':'owner','Outcome':'outcome','Lessons':'lessons','Date advertised':'advertised','Notice type':'notice','Initial screen':'screen','Screen reason':'reason','Next action':'next','Found by':'found_by','Source ID':'source_id','MD decision':'md_decision'};
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load '+src)); document.head.append(s); }); }
const NO_PLACEHOLDER=/^\s*(\(.*\)|n\/?a|tbc|tba|none|not shown|-+|see .*)\s*$/i;
function tenderId(o){ const no=String(o.no||'').trim(); if(no&&!NO_PLACEHOLDER.test(no)) return safeId(no); if(o.source_id) return safeId(o.source_id); return safeId(((o.client||'')+' '+(o.title||'')).trim()||no); }   // same ids as the automatic sync
const XLSX_URL='vendor/xlsx.full.min.js';
async function importXlsx(file){
  try{
    await loadScript(XLSX_URL);
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const ws=wb.Sheets['Pipeline']; if(!ws){ toast('This workbook has no "Pipeline" sheet.'); return; }
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const hi=rows.findIndex(r=>r&&r.includes('Tender no.')); if(hi<0){ toast('Could not find the Pipeline header row.'); return; }
    const hdr=rows[hi]; let added=0, updated=0; const now=new Date().toISOString();
    for(const r of rows.slice(hi+1)){
      const o={}; hdr.forEach((h,i)=>{ const k=XMAP[h]; let v=r[i]; if(!k||v==null||v==='') return; if(v instanceof Date){ v=new Date(Math.round(v.getTime()/60000)*60000).toISOString(); } if(typeof v==='string'&&v.startsWith('=')) return; o[k]=v; });
      if(!o.no && !o.title) continue;
      const id=tenderId(o), ex=byId('tenders',id);
      if(ex){ const up={}; for(const [k,v] of Object.entries(o)){ if(k==='deadline'){ const a=Date.parse(v), b=Date.parse(ex.deadline||''); if(!isNaN(a)&&(isNaN(b)||Math.abs(a-b)>60000)) up[k]=v; } else if(ex[k]==null||ex[k]==='') up[k]=v; } if(Object.keys(up).length){ await patch('tenders',id,{...up,source_updated_at:now}); updated++; } }
      else { await put('tenders',id,{...o,imported_at:now,found_at:now,status:o.status||'Watching'}); added++; }
    }
    const rowsRead=rows.slice(hi+1).filter(r=>r&&r.some(v=>v!=null&&v!=='')).length;
    try{ await db.doc('imports/last').set({at:new Date().toISOString(), by:me.name||'', file:file.name||'', rows:rowsRead, added, updated}); }catch(e){ console.warn(e); }
    logAct(`Imported pipeline workbook: ${added} new, ${updated} updated tenders`);
    toast(`Import finished: ${rowsRead} rows read – ${added} new, ${updated} updated${added||updated?'':' (everything was already up to date)'}. Syncing with the cloud scanner…`);
    if(window.NX_SYNC_NOW){ try{ const r=await window.NX_SYNC_NOW(); toast(r&&r.ok?`Sync done: ${r.added||0} new, ${r.updated||0} updated from the cloud scanner.`:'Import saved. The automatic sync will run within 10 minutes.'); }catch(_){ } }
  }catch(e){ toast('Import failed: '+e.message); }
}

let boqTimer=null, boqDraft=null;
function boqChanged(b){ boqDraft=b; clearTimeout(boqTimer); boqTimer=setTimeout(async()=>{ const d=boqDraft; boqDraft=null; await patch('boqs',d.id,{title:d.title,project_id:d.project_id||'',region:d.region||rtBoqRegion(d),contingency:d.contingency,vat:d.vat,bills:d.bills,scope:d.scope||''}); },900); }
async function aiBoq(b){
  const scope=$('#bq_scope')?.value.trim(); if(!scope){ toast('Describe the scope first.'); return; }
  b.scope=scope; const tender=b.tender_id?byId('tenders',b.tender_id):null;
  const r=await ai('boq',()=>sample.json(`You are a Tanzanian quantity surveyor preparing a Bill of Quantities in the style used on NeST public tenders (SMM-based, bills such as Preliminaries, Substructure, Concrete work, Walling, Roofing, Finishes, Doors & Windows, Painting, Plumbing, Electrical, External works).\n${tender?`Tender: ${tender.title} for ${tender.client}, ${tender.location}.`:''}\nScope from the QS:\n${scope}\n\nDraft the bills and measured items. Units: m, m2, m3, kg, No, Item, Sum, LS. Do not give quantities or rates (leave them null) unless the scope states them. Reply with only JSON: {"bills":[{"name":"...","items":[{"ref":"A","desc":"...","unit":"m2","qty":null,"rate":null}]}]}`,{modelTier:'default'}));
  if(!r?.bills) return;
  b.bills=[...(b.bills||[]), ...r.bills.map(x=>({name:x.name,items:(x.items||[]).map(i=>({ref:i.ref||'',desc:i.desc||'',unit:i.unit||'',qty:i.qty??'',rate:i.rate??''}))}))];
  await patch('boqs',b.id,{title:b.title,contingency:b.contingency,vat:b.vat,bills:b.bills,scope}); logAct(`AI drafted ${r.bills.length} bills for BoQ "${b.title}"`); toast(`Added ${r.bills.length} bills. Enter quantities from your take-off.`);
}
function matchRate(desc,unit,region){
  const w=s=>new Set(String(s).toLowerCase().match(/[a-z0-9]{3,}/g)||[]); const a=w(desc); let best=null,bs=0;
  const nums=t=>new Set((String(t).match(/\d+(?:\.\d+)?/g)||[]).map(x=>String(+x))); const an=nums(desc);
  for(const r0 of S.rates){ const r=rtN(r0); if(r.kind!=='item') continue; if(rtWords(r.unit)!==rtWords(unit)) continue; const b=w(r.desc); let n=0; a.forEach(x=>b.has(x)&&n++); let s=n/Math.max(1,Math.min(a.size,b.size)); if(s<.6) continue;
    if(an.size){ const bn=nums(r.desc); if([...an].some(x=>!bn.has(x))&&[...bn].some(x=>!an.has(x))) continue; }   // conflicting sizes, grades or thicknesses → not the same item
    if(region&&r.region===region) s+=.15; else if(r.region==='General') s+=.05;
    if(s>bs+1e-9||(Math.abs(s-bs)<1e-9&&best&&(r.price_date||'')>(best.price_date||''))){bs=s;best=r;} }
  return best;
}

  ['Metalwork & windows',/steel door|steel window|window|grille|burglar|alumin|railing|metal|gate|balustrade/],
  ['Carpentry & joinery',/timber|door|frame|joinery|cupboard|shelf|shelving|counter|architrave/],
  ['Finishes',/plaster|screed|tile|terrazzo|render|ceiling|skirting|floor|gypsum|cladding/],
  ['Earthworks',/excavat|\bfill|hardcore|termite|cart away|backfill|compact|murram|top ?soil|site clear/],
  ['Demolition & alterations',/demol|remov|strip|break|hack|dismantl/],

function rtGuessTrade(txt, kind){ if(kind==='material') return 'Materials'; if(kind==='labour') return 'Labour'; if(kind==='plant') return 'Plant'; const s=String(txt||'').toLowerCase(); for(const [n,re] of RT_TRADES) if(re.test(s)) return n; return 'Other'; }
function rtRegionOf(txt){ const s=String(txt||'').toLowerCase(); if(!s) return 'General'; if(/dar|kinondoni|ilala|temeke|ubungo|kigamboni/.test(s)) return 'Dar es Salaam'; if(/zanzibar|unguja|pemba/.test(s)) return 'Zanzibar'; if(/kibaha|bagamoyo|mkuranga|coast region/.test(s)) return 'Pwani'; if(/moshi/.test(s)) return 'Kilimanjaro'; return RT_REGIONS.find(r=>r!=='General'&&s.includes(r.toLowerCase()))||'General'; }
function rtBoqRegion(b){ if(!b) return 'General'; if(b.region) return b.region; const p=b.project_id?byId('projects',b.project_id):null, t=b.tender_id?byId('tenders',b.tender_id):null; return rtRegionOf((p?.location||'')+' '+(t?.location||'')); }
/* fill defaults for older rates that pre-date v66 */
function rtN(r){ const kind=r.kind||'item'; return {...r, kind, trade:r.trade||rtGuessTrade(r.desc,kind), region:r.region||'General', price_date:r.price_date??(r.updated_at||'').slice(0,10)}; }
function rtAge(r){ const d=Date.parse((r.price_date||'')+'T00:00'); return isNaN(d)?null:Math.floor((Date.now()-d)/864e5); }
const rtOld = r => { const a=rtAge(r); return a!=null&&a>RT_OLD_DAYS; };
const rtUndated = r => !r.price_date;
const rtCheck = r => rtOld(r)||rtUndated(r);
const rtWords = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const rtKey = (desc,unit,region) => rtWords(desc)+'|'+rtWords(unit)+'|'+String(region||'General').toLowerCase();
function rtBuTotals(bu){ const L=bu?.lines||[]; const s={M:0,L:0,P:0}; L.forEach(l=>{ s[l.t]=(s[l.t]||0)+(+l.qty||0)*(+l.price||0); }); const sub=s.M+s.L+s.P, ohp=sub*((+(bu?.ohp??15)||0)/100); return {...s, sub, ohp, rate:sub+ohp}; }
const rtHasBu = r => (r.bu?.lines||[]).length>0;
function rtFmt(n){ return (n==null||n===''||isNaN(+n))?'—':Math.round(+n).toLocaleString('en-US'); }
function rtChange(r){ const h=r.hist||[]; if(!h.length||!(+h[h.length-1].rate)) return ''; const p=(+r.rate - +h[h.length-1].rate)/(+h[h.length-1].rate)*100; if(Math.abs(p)<0.5) return ''; return `<span class="small" style="color:${p>0?'var(--bad)':'var(--good)'}" title="Change from the previous price ${rtFmt(h[h.length-1].rate)}">${p>0?'▲':'▼'}${Math.abs(p).toFixed(0)}%</span>`; }

function rtRedraw(){ const o=$('#overlay'); if(!drawer) return; const y=o.querySelector('.db')?.scrollTop||0; o.innerHTML=drawer.type==='rate'?rateDrawer():rtImpDrawer(); document.body.style.overflow='hidden'; const b=o.querySelector('.db'); if(b) b.scrollTop=y; }
function rtLiveTotals(){ const r=drawer.rt, T=rtBuTotals(r.bu); (r.bu.lines||[]).forEach((l,i)=>{ const c=$('#rla_'+i); if(c) c.textContent=rtFmt((+l.qty||0)*(+l.price||0)); }); const set=(id,v)=>{ const e=$('#'+id); if(e) e.textContent=rtFmt(v); }; set('rbM',T.M); set('rbL',T.L); set('rbP',T.P); set('rbO',T.ohp); set('rbR',T.rate); const rr=$('#rf_rate'); if(rr&&rr.disabled) rr.value=rtFmt(T.rate); }
function rtMatchRes(desc, unit, t){ const kind=t==='L'?'labour':t==='P'?'plant':'material'; const w=s=>new Set(rtWords(s).split(' ').filter(x=>x.length>=3)); const a=w(desc); let best=null,bs=0;
  for(const r0 of S.rates){ const r=rtN(r0); if(r.kind!==kind) continue; const b=w(r.desc); let n=0; a.forEach(x=>b.has(x)&&n++); let s=n/Math.max(1,Math.min(a.size,b.size)); if(unit&&r.unit&&rtWords(unit)!==rtWords(r.unit)) s-=.25; if(s>bs||(s===bs&&best&&(r.price_date||'')>(best.price_date||''))){bs=s;best=r;} }
  return bs>=.5?best:null; }
function rtFillPrices(onlyEmpty){ let n=0; (drawer.rt.bu.lines||[]).forEach(l=>{ if(onlyEmpty&&l.price!==''&&l.price!=null) return; const m=rtMatchRes(l.desc,l.unit,l.t); if(m){ l.price=+m.rate; if(!l.unit) l.unit=m.unit; n++; } }); return n; }
async function rtAiBuildUp(){
  const r=drawer.rt; if(!(r.desc||'').trim()||!(r.unit||'').trim()){ toast('Enter the description and unit first.'); return; }
  toast('AI is drafting the build-up quantities…');
  const res=await ai('rtbu',()=>sample.json(`You are a senior Tanzanian quantity surveyor. Prepare a unit rate build-up for this BoQ item, for construction in ${r.region&&r.region!=='General'?r.region+', ':''}Tanzania.\nItem: ${r.desc}\nUnit: ${r.unit}\n\nList the resources needed for ONE ${r.unit}: materials (with normal waste allowance included in the quantity), labour (crew hours or days) and plant. Use realistic standard constants (e.g. cement bags, sand and aggregate m3, water, blocks per m2, mortar, labour output rates). Use common Tanzanian units (bag, m3, kg, No, litre, day, hr). Do NOT give any prices. Reply with only JSON: {"lines":[{"t":"M","desc":"Cement 50kg bag","unit":"bag","qty":0.0},{"t":"L","desc":"Mason","unit":"day","qty":0.0},{"t":"P","desc":"Concrete mixer","unit":"day","qty":0.0}],"ohp":15,"note":"short assumptions"}`,{modelTier:'default'}));
  if(!res?.lines?.length) return;
  drawer.rt.bu={lines:res.lines.filter(l=>l&&l.desc).map(l=>({t:['M','L','P'].includes(l.t)?l.t:'M',desc:String(l.desc),unit:String(l.unit||''),qty:+l.qty||0,price:''})), ohp:+res.ohp||drawer.rt.bu?.ohp||15};
  if(res.note&&!drawer.rt.note) drawer.rt.note=String(res.note).slice(0,200);
  const n=rtFillPrices(true), m=drawer.rt.bu.lines.length; rtRedraw();
  toast(`AI drafted ${m} resource lines. ${n} prices filled from your library${n<m?` – enter the other ${m-n} prices (add them to the library as material/labour/plant prices to reuse them)`:''}. Check the quantities.`);
}
async function rtSave(){

  const rate=has?Math.round(rtBuTotals(r.bu).rate):(r.rate===''||r.rate==null?NaN:+r.rate);

  const v={desc,unit,rate,kind:r.kind||'item',trade:r.trade||rtGuessTrade(desc,r.kind),region:r.region||'General',price_date:r.price_date||today(),source:(r.source||'').trim(),note:(r.note||'').trim(),
    bu:has?{lines:r.bu.lines.map(l=>({t:l.t,desc:l.desc||'',unit:l.unit||'',qty:l.qty===''?0:+l.qty,price:l.price===''?0:+l.price})),ohp:+(r.bu.ohp??15)||0}:null, hist:ex?.hist||[]};
  const dupe=S.rates.find(x=>x.id!==drawer.id&&rtKey(x.desc,x.unit,rtN(x).region)===rtKey(desc,unit,v.region));
  if(dupe&&!drawer.dupeOk){ drawer.dupeOk=true; toast('The same item and unit already exist for this region. Press Save again to keep both, or open the existing rate instead.'); return; }
  if(ex){ const o=rtN(ex); if(Math.round(+o.rate)!==Math.round(rate)) v.hist=[...(ex.hist||[]),{rate:+o.rate,date:o.price_date,source:o.source||'',by:ex.updated_by||''}].slice(-30); await patch('rates',ex.id,{...v,created_at:ex.created_at||ex.updated_at||''}); }
  else await put('rates',null,{...v,created_at:new Date().toISOString()});

/* ---------- import: priced BoQ in NEXUS or Excel file ---------- */
function rtImpOpen(mode, boqId){ const b=boqId?byId('boqs',boqId):null; const imp={mode,boq:boqId||'',region:b?rtBoqRegion(b):'General',trade:'',src:b?b.title:'',date:b?(b.updated_at||'').slice(0,10)||today():today(),upd:'update',rows:b?rtImpFromBoq(b):null,file:''}; $('#overlay').innerHTML=''; openDrawer('rtimp',null,{imp,form:false}); }
function rtImpFromBoq(b){ const rows=[]; (b.bills||[]).forEach(bl=>(bl.items||[]).forEach(it=>{ const rate=+it.rate; if(!(rate>0)||!(it.desc||'').trim()||!(it.unit||'').trim()) return; rows.push({desc:String(it.desc).trim(),unit:String(it.unit).trim(),rate,hint:bl.name||''}); })); return rows; }
async function rtImpFile(file){
  try{ await loadScript(XLSX_URL); }catch(e){ toast(e.message); return; }
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true}); const rows=[];
    for(const sn of wb.SheetNames){ const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null}); let hi=-1, cD=-1, cU=-1, cR=-1, title='';
      for(let i=0;i<Math.min(A.length,40);i++){ const r=A[i]||[]; const s=r.map(x=>String(x??'').toLowerCase().trim()); const d=s.findIndex(x=>/^desc|description|item description|particulars/.test(x)), rr=s.findIndex(x=>/^(unit )?rate|^price|unit price|rate \(|^amount per/.test(x)&&!/amount$/.test(x)), u=s.findIndex(x=>/^unit$|^units?\b|^uom/.test(x)&&!/price|rate/.test(x));
        if(!title){ const t=s.find(x=>x.length>4); if(t) title=t; }
        if(d>=0&&rr>=0){ hi=i; cD=d; cR=rr; cU=u; break; } }
      if(hi<0) continue; let bill=/bill/i.test(title)?title:sn;
      for(const r of A.slice(hi+1)){ if(!r) continue; const d=r[cD], rate=typeof r[cR]==='number'?r[cR]:+String(r[cR]??'').replace(/[, ]/g,''); const unit=cU>=0?r[cU]:null;
        if(typeof d==='string'&&/^bill|^total|carried|collection|summary/i.test(d.trim())&&!(rate>0)){ if(/^bill/i.test(d.trim())) bill=d; continue; }
        if(!d||!(rate>0)||!unit) continue; rows.push({desc:String(d).replace(/\s+/g,' ').trim(),unit:String(unit).trim(),rate,hint:bill}); } }
    drawer.imp.rows=rows; drawer.imp.file=file.name; if(!drawer.imp.src) drawer.imp.src=file.name.replace(/\.[a-z]+$/i,'');
    rtRedraw(); if(!rows.length) toast('No priced items found. The sheet needs columns named Description, Unit and Rate.');
  }catch(e){ toast('Could not read the file: '+e.message); }
}
function rtImpScan(){ const I=drawer.imp; if(I.mode==='boq'){ const b=byId('boqs',I.boq); I.rows=b?rtImpFromBoq(b):null; } }
function rtImpPlan(){ const I=drawer.imp; if(!I.rows) return null; const seen=new Set(), plan=[];
  for(const x of I.rows){ const region=I.region||'General', key=rtKey(x.desc,x.unit,region); if(seen.has(key)) continue; seen.add(key);
    const ex=S.rates.find(r=>rtKey(r.desc,r.unit,rtN(r).region)===key); const st=!ex?'new':Math.round(+ex.rate)===Math.round(x.rate)?'same':'change';
    plan.push({...x,region,ex,st,trade:I.trade||rtGuessTrade(x.hint+' '+x.desc,'item')||rtGuessTrade(x.desc,'item')}); }
  plan.forEach(p=>{ if(!I.trade){ const t1=rtGuessTrade(p.desc,'item'); p.trade=t1!=='Other'?t1:rtGuessTrade(p.hint,'item'); } });
  return plan; }

    ${plan.slice(0,300).map(p=>`<tr><td>${p.st==='new'?'<span class="chip good">new</span>':p.st==='change'?'<span class="chip amb">change</span>':'<span class="chip">same</span>'}</td><td class="small">${esc(p.desc.slice(0,140))}</td><td>${esc(p.unit)}</td><td class="r num">${rtFmt(p.rate)}</td><td class="hide-m r num sub">${p.ex?rtFmt(p.ex.rate):''}</td><td class="hide-m sub">${esc(p.trade)}</td></tr>`).join('')}

async function rtDoImport(){
  const I=drawer.imp, plan=rtImpPlan(); if(!plan) return; UI.busy.rtimp=true; rtRedraw(); let a=0,u=0;

      if(p.st==='new'){ await put('rates',null,{desc:p.desc,unit:p.unit,rate:Math.round(p.rate*100)/100,kind:'item',trade:p.trade,region:p.region,price_date:date,source:src,note:'',bu:null,hist:[],created_at:new Date().toISOString()}); a++; }
      else if(p.st==='change'&&I.upd==='update'){ const o=rtN(p.ex); await patch('rates',p.ex.id,{rate:Math.round(p.rate*100)/100,price_date:date,source:src,region:o.region,trade:o.trade,kind:o.kind,hist:[...(p.ex.hist||[]),{rate:+o.rate,date:o.price_date,source:o.source||'',by:p.ex.updated_by||''}].slice(-30)}); u++; } }
  } finally { UI.busy.rtimp=false; }
  logAct(`Imported rates into the library${I.src?' from '+I.src:''}: ${a} new, ${u} updated`);
  closeDrawer(); toast(`Rate library: ${a} new rate${a===1?'':'s'}, ${u} updated.`);
}

/* ===================== v68 AI BoQ BUILDER (tender documents → priced BoQ) + QS PRICING ===================== */
const BQ_UNITS=/^(m|m1|lm|rm|m2|sm|sqm|m3|cm|kg|t|tn|ton|tonne|tonnes|no|nr|nos|no\.|item|items|sum|ls|l\.s\.?|lot|pc|pcs|set|sets|pair|pairs|prs|day|days|hr|hrs|week|month|mth|litre|litres|l|bag|bags|trip|trips|point|points|pt|pts|%|ps|p\.s\.?|prov\.?\s*sum)$/i;
function bqNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return isFinite(v)?v:null; const n=+String(v).replace(/[, ]/g,''); return isFinite(n)&&String(v).trim()!==''?n:null; }
function bqStats(b){ const s={n:0,priced:0,lib:0,ai:0,man:0,other:0,old:0,noqty:0}; (b.bills||[]).forEach(bl=>(bl.items||[]).forEach(it=>{ if(!(it.desc||'').trim()) return; s.n++; if(it.qty===''||it.qty==null) s.noqty++; if(it.rate===''||it.rate==null) return; s.priced++; const k=it.p?.s; if(k==='lib'){ s.lib++; if(it.p.old) s.old++; } else if(k==='ai') s.ai++; else if(k==='man') s.man++; else s.other++; })); s.pct=s.n?Math.round(s.priced/s.n*100):0; return s; }
function bqSrcChip(it){
  if(it.rate===''||it.rate==null) return '<span class="chip bad">Unpriced</span>';
  const p=it.p||{};
  if(p.s==='lib') return `<span class="chip ${p.old?'amb':'good'}" title="${esc('Library: '+(p.src||'')+(p.date?' · '+p.date:' · no price date')+(p.reg?' · '+p.reg:''))}">Library${p.old?' · old':''}</span>`;
  if(p.s==='ai') return `<span class="chip amb" title="${esc('AI estimate – check. Basis: '+(p.basis||''))}">AI estimate</span>`;
  if(p.s==='man') return `<span class="chip blue" title="${esc('Rate entered by '+(p.by||'QS')+(p.at?' on '+p.at:''))}">QS rate</span>`;
  return '<span class="chip">Entered</span>';
}
function bqLibP(m){ return {s:'lib',id:m.id,src:m.source||'',date:m.price_date||'',reg:m.region||'General',old:rtCheck(m)}; }

/* ---------- QS pricing view (BoQ editor → "Price (QS)") ---------- */

  const keep=it=>{ if(!(it.desc||'').trim()) return false; const un=it.rate===''||it.rate==null; if(f==='unpriced') return un; if(f==='ai') return it.p?.s==='ai'; if(f==='old') return it.p?.s==='lib'&&it.p.old; if(f==='man') return it.p?.s==='man'; return true; };
  const segs=[['all',`All ${s.n}`],['unpriced',`Unpriced ${s.n-s.priced}`],['ai',`AI estimates ${s.ai}`],['old',`Old library ${s.old}`],['man',`QS rates ${s.man}`]];
  const head=`<div class="card"><div class="bd">
    <div class="toolbar small"><b>Priced ${s.priced} of ${s.n} items</b><span class="sub">· region ${esc(reg)}</span><div class="sp"></div><span class="num">${s.pct}%</span></div><div class="bar"><i style="width:${s.pct}%"></i></div>

    <p class="sub" style="margin:8px 0 0">Type your current rate in <b>Your rate</b> – it is marked <b>QS rate</b>. <b>Library</b> shows the best matching library rate for this region (tap <b>Use</b> to take it). <b>AI estimate</b> rates were proposed from similar library rates and must be checked.</p></div></div>
  <div class="toolbar" style="flex-wrap:wrap;gap:8px"><div class="seg" style="flex-wrap:wrap">${segs.map(([k,l])=>`<button data-bx="filter" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div><div class="sp"></div>
    ${canWrite?`<button class="btn" data-bx="filllib">Fill empty from library</button><button class="btn" data-bx="savelib" ${s.man?'':'disabled'} title="Adds or updates these rates in the Rate library (old price kept in history)">Save my QS rates to library (${s.man})</button>`:''}</div>`;
  const bills=(b.bills||[]).map((bl,bi)=>{ const rows=(bl.items||[]).map((it,ii)=>({it,ii})).filter(x=>keep(x.it)); if(!rows.length) return '';
    return `<div class="card"><div class="hd"><span class="label mono">Bill ${bi+1}</span><h2 style="font-size:16px">${esc(bl.name||'')}</h2><div class="sp"></div><span class="num">${tzs(boqTotals(b).bills[bi].total)}</span></div><div class="tbl-wrap"><table><thead><tr><th style="width:52px">Item</th><th>Description</th><th style="width:56px">Unit</th><th class="r" style="width:80px">Qty</th><th class="r" style="width:150px">Library</th><th class="r" style="width:130px">Your rate</th><th class="r" style="width:130px">Amount</th><th style="width:96px">Source</th></tr></thead><tbody>
      ${rows.map(({it,ii})=>{ const m=matchRate(it.desc,it.unit,reg); const sug=m?`<span class="num">${rtFmt(m.rate)}</span>${rtCheck(m)?' <span class="chip amb" style="font-size:10px">old</span>':''}<div class="sub" style="font-size:11px">${esc((m.region||'')+' · '+(m.price_date||'no date'))}</div>${canWrite&&Math.round(+m.rate)!==Math.round(+it.rate||0)?`<button class="btn sm" data-bx="use" data-i="${bi}.${ii}" style="margin-top:3px">Use</button>`:''}`:'<span class="sub">no match</span>';
        return `<tr><td class="mono small">${esc(it.ref||'')}</td><td class="small" style="max-width:520px">${esc(it.desc||'')}${it.p?.s==='ai'&&it.p.basis?`<div class="sub" style="font-size:11px">AI basis: ${esc(it.p.basis)}</div>`:''}</td><td>${esc(it.unit||'')}</td><td class="r num">${it.qty===''||it.qty==null?'<span class="sub">—</span>':(+it.qty).toLocaleString('en-US')}</td><td class="r">${sug}</td>

    </tbody></table></div></div>`; }).join('');

async function bqFillLib(){ const b=curBoq(); const reg=rtBoqRegion(b); let n=0,o=0; (b.bills||[]).forEach(bl=>(bl.items||[]).forEach(it=>{ if(it.rate!==''&&it.rate!=null) return; const m=matchRate(it.desc,it.unit,reg); if(m){ it.rate=+m.rate; it.p=bqLibP(m); n++; if(rtCheck(m)) o++; } })); await patch('boqs',b.id,{bills:b.bills}); toast(n?`Filled ${n} rates from the library${o?` – ${o} are old or undated: check them`:''}.`:'No empty items matched a library rate.'); }
async function bqUse(bi,ii){ const b=curBoq(); const it=b.bills?.[bi]?.items?.[ii]; if(!it) return; const m=matchRate(it.desc,it.unit,rtBoqRegion(b)); if(!m) return; it.rate=+m.rate; it.p=bqLibP(m); await patch('boqs',b.id,{bills:b.bills}); }
async function bqSaveLib(){ const b=curBoq(); const reg=rtBoqRegion(b), date=today(), src='QS pricing – '+(b.title||'BoQ'); let a=0,u=0,same=0;
  const items=[]; (b.bills||[]).forEach(bl=>(bl.items||[]).forEach(it=>{ if(it.p?.s==='man'&&+it.rate>0&&(it.desc||'').trim()&&(it.unit||'').trim()) items.push({it,bill:bl.name||''}); }));
  if(!items.length){ toast('No QS rates to save yet.'); return; }
  if(!await confirmBox(`Save ${items.length} QS rate${items.length===1?'':'s'} to the Rate library for ${reg}? Existing library rates for the same item and unit are updated and their old price is kept in history.`,'Save to library')) return;
  toast('Saving rates to the library…');
  for(const {it,bill} of items){ const k=rtKey(it.desc,it.unit,reg), ex=S.rates.find(r=>rtKey(r.desc,r.unit,rtN(r).region)===k);
    if(!ex){ await put('rates',null,{desc:it.desc.trim(),unit:it.unit.trim(),rate:+it.rate,kind:'item',trade:(()=>{ const t=rtGuessTrade(it.desc,'item'); return t!=='Other'?t:rtGuessTrade(bill,'item'); })(),region:reg,price_date:date,source:src,note:'',bu:null,hist:[],created_at:new Date().toISOString()}); a++; }
    else if(Math.round(+ex.rate)!==Math.round(+it.rate)){ const o=rtN(ex); await patch('rates',ex.id,{rate:+it.rate,price_date:date,source:src,hist:[...(ex.hist||[]),{rate:+o.rate,date:o.price_date,source:o.source||'',by:ex.updated_by||''}].slice(-30)}); u++; }
    else if(o_date_needs(ex,date)){ await patch('rates',ex.id,{price_date:date,source:src}); same++; } else same++; }

let PDFJS=null;
async function recPdfText(path){
  if(!PDFJS){ PDFJS=await import('./vendor/pdfjs/pdf.min.mjs'); PDFJS.GlobalWorkerOptions.workerSrc='vendor/pdfjs/pdf.worker.min.mjs'; }
  const url=await window.NX_REC.url(path,false), buf=await (await fetch(url)).arrayBuffer();
  const doc=await PDFJS.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise; let t='';
  for(let i=1;i<=Math.min(doc.numPages,80)&&t.length<160000;i++){ const pg=await doc.getPage(i); const c=await pg.getTextContent(); t+=`\n--- page ${i} ---\n`+c.items.map(x=>x.str).join(' '); }
  return {text:t, pages:doc.numPages}; }
async function recAi(){ const r=byId('records',drawer?.id), f=r&&recFile(r); if(!f) return;
  const res=await ai('rec',async()=>{ let pdf; try{ pdf=await recPdfText(f.path); }catch(e){ throw new Error('the PDF could not be read ('+(e.message||e)+')'); }
    if(pdf.text.replace(/---.*?---/g,'').trim().length<300) throw new Error('this PDF is a scanned picture with no text. Enter the key details by hand, or upload a text PDF.');
    const prompt=`You read construction contracts for Nordic Construction Co. Ltd (Tanzania). From the contract text below, extract the facts exactly as written. Use null when something is not stated – never guess.
Reply as JSON: {"summary":"4-6 plain sentences: what the contract is for, who with, value, time, main risks","parties":["..."],"contract_sum":number|null,"currency":"TZS|USD|...","start":"YYYY-MM-DD|null","end":"YYYY-MM-DD|null","duration":"...","advance":"...","retention":"...","dlp":"defects liability period","ld":"liquidated damages rate and cap","payment_terms":"...","performance_security":"...","insurance":"...","obligations":["up to 8 key obligations for Nordic"],"risks":["up to 6 clauses Nordic should watch"]}
CONTRACT (${pdf.pages} pages):\n${pdf.text.slice(0,150000)}`;
    return await sample.json(prompt); });
  if(res){ await patch('records',r.id,{ai:{...res,at:new Date().toISOString(),file:f.name}}); window.NX_REC?.log(r.id,'AI summary'); toast('Contract summary saved.'); } }
async function recAiFill(){ const r=byId('records',drawer?.id), a=r&&r.ai; if(!a) return; const up={}, iso=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'')?x:null;

/* ---------- Ask NEXUS: chat screen in the style of ChatGPT / Gemini ---------- */
function askFmt(t){ // plain AI text → tidy HTML (paragraphs, lists, tables, bold labels)
  const lines=String(t||'').replace(/\r/g,'').split('\n'); let h='', list=null, tbl=null;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const close=()=>{ if(list){ h+=`</${list}>`; list=null; } if(tbl){ h+='<div class="ask-tbl"><table>'+tbl.map((r,k)=>'<tr>'+r.map(c=>k===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table></div>'; tbl=null; } };
  for(const raw of lines){ const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ if(list){ h+=`</${list}>`; list=null; } const cells=l.slice(1,-1).split('|').map(c=>c.trim()); if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue; (tbl=tbl||[]).push(cells); continue; }
    if(tbl) close();
    let m;
    if((m=l.match(/^[-*•]\s+(.*)/))){ if(list!=='ul'){ close(); h+='<ul>'; list='ul'; } h+=`<li>${inl(m[1])}</li>`; continue; }
    if((m=l.match(/^(\d+)[.)]\s+(.*)/))){ if(list!=='ol'){ close(); h+='<ol>'; list='ol'; } h+=`<li>${inl(m[2])}</li>`; continue; }
    close();
    if(!l){ continue; }
    if((m=l.match(/^#{1,4}\s*(.*)/))) { h+=`<h4>${inl(m[1])}</h4>`; continue; }
    if(l.length<70&&/:$/.test(l)&&!/[.!?]$/.test(l.slice(0,-1))) { h+=`<h4>${inl(l.slice(0,-1))}</h4>`; continue; }
    h+=`<p>${inl(l)}</p>`; }
  close(); return h; }

function planned(ms, at){ const s=toDate(ms.planned_start), f=toDate(ms.planned_finish); if(!s||!f) return 0; if(at<=s) return 0; if(at>=f) return 1; return (at-s)/(f-s); }
function programme(pid, at=new Date()){

  const pl=ms.reduce((a,m)=>a+(+m.weight||0)*planned(m,at),0)/W*100, ac=ms.reduce((a,m)=>a+(+m.weight||0)*Math.min(100,+m.progress||0)/100,0)/W*100;
  return {planned:pl, actual:ac, weight:W, n:ms.length};
}
function projectFacts(p){

  const voVal=approved.reduce((a,v)=>a+(+v.value_approved||0),0), eot=approved.reduce((a,v)=>a+(+v.days_granted||0),0);
  const pending=vos.filter(v=>v.status==='Instructed'||v.status==='Submitted');
  const revEnd=p.end?new Date(new Date(p.end).getTime()+eot*864e5):null;
  const risks=S.risks.filter(r=>r.project_id===p.id&&r.status!=='Closed'), high=risks.filter(r=>(+r.likelihood||0)*(+r.impact||0)>=15);
  const snags=S.snags.filter(s=>s.project_id===p.id), openSn=snags.filter(s=>s.status==='Open');

function sCurve(pid){

  if(!(e>s)) return ''; const W=620,H=200,L=40,B=26, x=d=>L+(d-s)/(e-s)*(W-L-12), y=v=>H-B-v/100*(H-B-12);
  const pts=[]; for(let i=0;i<=40;i++){ const d=new Date(s.getTime()+(e-s)*i/40); pts.push([x(d),y(programme(pid,d).planned)]); }

/* ===================== PROGRAMME TOOLS: Gantt, links, critical path, baseline, forecast, look-ahead, portfolio ===================== */
const DAY=864e5;
const pd=v=>{ if(!v) return null; const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); const d=new Date(v); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
const ymd=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dDiff=(a,b)=>Math.round((a-b)/DAY);
const today0=()=>pd(ymd(new Date()));
const msOf=pid=>S.milestones.filter(m=>m.project_id===pid);
const msPg=m=>Math.max(0,Math.min(100,+m.progress||0));
const msStart=m=>pd(m.planned_start), msFinish=m=>m.kind==='milestone'?pd(m.planned_start):(pd(m.planned_finish)||pd(m.planned_start));
const msPreds=m=>Array.isArray(m.preds)?m.preds.filter(Boolean):[];

function msFields(pid, selfId){
  const others=msOf(pid).filter(m=>m.id!==selfId).sort((a,b)=>(a.planned_start||'').localeCompare(b.planned_start||'')).map(m=>[m.id,`${m.name} (${fmtD(m.planned_finish||m.planned_start)})`]);
  return [{k:'name',label:'Activity / milestone',req:1,full:1},
    {k:'kind',label:'Type',type:'select',options:[['activity','Activity (bar on the Gantt chart)'],['milestone','Milestone ◆ (key date, e.g. handover)']]},
    {k:'resp',label:'Responsible / trade',ph:'e.g. Masons – Juma'},
    {k:'planned_start',label:'Planned start',type:'date',req:1},{k:'planned_finish',label:'Planned finish',type:'date',help:'Not needed for a milestone'},
    {k:'weight',label:'Weight (% of contract value)',type:'number',help:'Weights of all activities should add up to 100 (milestones: 0)'},
    {k:'progress',label:'Actual progress %',type:'number',def:0},
    {k:'preds',label:'Starts after (predecessors) – moving these moves this one automatically',type:'checks',full:1,options:others,empty:'No other activities in this programme yet.'},
    {k:'lag',label:'Gap after predecessors (days)',type:'number',def:0},
    {k:'actual_start',label:'Actual start',type:'date'},{k:'actual_finish',label:'Actual finish',type:'date'}];
}
function msNormalise(v){
  if(v.kind==='milestone'||!v.planned_finish) v.planned_finish=v.planned_start;
  if(pd(v.planned_finish)<pd(v.planned_start)) v.planned_finish=v.planned_start;
  v.progress=Math.max(0,Math.min(100,+v.progress||0)); v.weight=+v.weight||0; v.lag=+v.lag||0; v.preds=Array.isArray(v.preds)?v.preds:[];
  if(v.progress>0&&!v.actual_start) v.actual_start=today();
  if(v.progress>=100&&!v.actual_finish) v.actual_finish=today();
  if(v.progress<100&&v.actual_finish) v.actual_finish='';
  return v;
}
// order activities so every predecessor comes first (null if the links loop back)
function msOrder(ms){
  const by=new Map(ms.map(m=>[m.id,m])), indeg=new Map(ms.map(m=>[m.id,0])), succ=new Map(ms.map(m=>[m.id,[]]));
  ms.forEach(m=>msPreds(m).forEach(p=>{ if(by.has(p)){ indeg.set(m.id,indeg.get(m.id)+1); succ.get(p).push(m.id); } }));
  const q=ms.filter(m=>!indeg.get(m.id)).map(m=>m.id), out=[];
  while(q.length){ const id=q.shift(); out.push(by.get(id)); succ.get(id).forEach(s=>{ indeg.set(s,indeg.get(s)-1); if(!indeg.get(s)) q.push(s); }); }
  return out.length===ms.length?{order:out,succ,by}:null;
}
// automatic scheduling: an activity that has not started is pushed later if a predecessor now finishes later
async function pmReschedule(pid){
  const ms=msOf(pid).map(m=>({...m})), o=msOrder(ms); if(!o){ toast('These links make a loop (A after B after A). Please remove one link.'); return 0; }
  const moved=[];
  for(const m of o.order){ const P=msPreds(m).map(id=>o.by.get(id)).filter(Boolean); if(!P.length||msPg(m)>0) continue;
    const req=addD(new Date(Math.max(...P.map(p=>(p.actual_finish&&msPg(p)>=100?pd(p.actual_finish):msFinish(p)).getTime()))),1+(+m.lag||0));
    const s=msStart(m), f=msFinish(m); if(!s||s>=req) continue;
    const dur=dDiff(f,s); m.planned_start=ymd(req); m.planned_finish=m.kind==='milestone'?m.planned_start:ymd(addD(req,dur)); moved.push(m); }
  for(const m of moved) await patch('milestones',m.id,{planned_start:m.planned_start,planned_finish:m.planned_finish});
  if(moved.length) toast(`${moved.length} following ${moved.length>1?'activities were':'activity was'} moved to keep the links.`);
  return moved.length;
}
// critical path (CPM backward pass on the current dates): float in days, critical = no float
function pmCpm(pid){
  const ms=msOf(pid), o=msOrder(ms), res=new Map(); if(!ms.length) return {res,end:null};
  const end=new Date(Math.max(...ms.map(m=>(msFinish(m)||new Date(0)).getTime())));
  const order=o?o.order:ms, succ=o?o.succ:new Map(ms.map(m=>[m.id,[]])), by=new Map(ms.map(m=>[m.id,m]));
  for(const m of [...order].reverse()){
    const s=msStart(m), f=msFinish(m); if(!s) continue;
    const S2=(succ.get(m.id)||[]).map(id=>({m:by.get(id),r:res.get(id)})).filter(x=>x.r);
    const lf=S2.length?new Date(Math.min(...S2.map(x=>addD(x.r.ls,-1-(+x.m.lag||0)).getTime()))):end;
    const ls=addD(lf,-dDiff(f,s)), fl=dDiff(lf,f);
    res.set(m.id,{ls,lf,float:fl,crit:fl<=0&&msPg(m)<100});
  }
  return {res,end};
}
// forecast completion from progress so far (schedule performance index)
function pmForecast(p){
  const ms=msOf(p.id); if(!ms.length) return null;
  const pr=programme(p.id), F=projectFacts(p), start=new Date(Math.min(...ms.map(m=>(msStart(m)||new Date(8.64e15)).getTime()))), end=new Date(Math.max(...ms.map(m=>(msFinish(m)||new Date(0)).getTime())));
  const t=today0(); let spi=null, fc=end;
  if(pr&&pr.actual>=99.5) fc=new Date(Math.max(...ms.map(m=>(pd(m.actual_finish)||msFinish(m)).getTime())));
  else if(pr&&pr.planned>=3&&t>start){ spi=Math.max(.2,Math.min(2,pr.actual/pr.planned)); const f2=addD(start,Math.ceil(dDiff(end,start)/spi)); fc=f2>end||spi<1?new Date(Math.max(f2,end)):end; }
  ms.forEach(m=>{ if(msPg(m)<100&&msFinish(m)&&msFinish(m)<t){ const rem=Math.max(1,Math.ceil(dDiff(msFinish(m),msStart(m)||msFinish(m))*(1-msPg(m)/100))); const f3=addD(t,rem); if(f3>fc) fc=f3; } });
  const contract=F.revEnd?pd(ymd(F.revEnd)):(p.end?pd(p.end):null);
  const slip=contract?dDiff(fc,contract):null;
  const late=ms.filter(m=>msPg(m)<100&&msFinish(m)&&msFinish(m)<t).length;
  const status=pr&&pr.actual>=99.5?'done':slip!=null&&slip>0?'late':(spi!=null&&spi<.9)||(slip!=null&&slip>-14)||late?'risk':'ok';
  return {spi,fc,contract,slip,late,status,pr,start,end,base:ms.some(m=>m.baseline_finish)};
}
const PM_ST={ok:['good','On time'],risk:['amb','At risk'],late:['bad','Late'],done:['blue','Complete']};
const pmChip=f=>f?`<span class="chip ${PM_ST[f.status][0]}">${PM_ST[f.status][1]}</span>`:'<span class="chip">No programme</span>';

function pmGantt(pid, opt={}){
  const ms=msOf(pid).filter(m=>msStart(m)).sort((a,b)=>(a.planned_start||'').localeCompare(b.planned_start||'')||(a.name||'').localeCompare(b.name||''));
  if(!ms.length) return '<div class="empty">No activities yet. Add the first activity – NEXUS draws the Gantt chart automatically.</div>';
  const cpm=pmCpm(pid).res, t=today0();
  const dates=ms.flatMap(m=>[msStart(m),msFinish(m),pd(m.baseline_start),pd(m.baseline_finish),pd(m.actual_start)]).filter(Boolean).concat(opt.fc?[opt.fc]:[]);

async function pmApplyReport(){
  const ins=[...document.querySelectorAll('[data-rpms]')]; let n=0;
  for(const el of ins){ const m=byId('milestones',el.dataset.rpms); if(!m) continue; const v=Math.max(0,Math.min(100,+el.value||0)); if(v===msPg(m)) continue;
    const rd=document.querySelector('#f_date')?.value||today();   // the report's date, not the day it is typed

function pmAlerts(A){
  S.projects.filter(p=>!/complet|closed|cancel|lost/i.test(p.status||'')).forEach(p=>{ const f=pmForecast(p); if(f&&f.status==='late') A.push({lvl:'bad',kind:'Programme late',text:`${p.name} – forecast finish ${fmtD(f.fc)}`,sub:`${f.slip} days after contract completion ${fmtD(f.contract)} · speed ${f.spi!=null?f.spi.toFixed(2):'—'}`,go:['project',p.id],sort:7}); });
  S.milestones.forEach(m=>{ if((+m.progress||0)<100&&m.planned_finish&&daysLeft(m.planned_finish+'T23:59')<0) A.push({lvl:'warn',kind:'Activity late',text:`${m.name}`,sub:`${projName(m.project_id)} · planned finish ${fmtD(m.planned_finish)} · ${+m.progress||0}% done`,go:['project',m.project_id],sort:12}); });
  S.variations.forEach(v=>{ if(v.status==='Instructed'&&v.date_instructed&&daysLeft(v.date_instructed)<-14) A.push({lvl:'warn',kind:'Variation not submitted',text:`${v.ref} – ${v.description}`,sub:`${projName(v.project_id)} · instructed ${fmtD(v.date_instructed)}`,go:['project',v.project_id],sort:14}); });
  S.risks.forEach(r=>{ if(r.status!=='Closed'&&(+r.likelihood||0)*(+r.impact||0)>=15) A.push({lvl:'bad',kind:'High risk',text:r.title,sub:`${projName(r.project_id)} · owner ${staffName(r.owner)}`,go:['project',r.project_id],sort:6}); });
  S.projects.forEach(p=>{ if(!p.pc_date) return; const rel=new Date(new Date(p.pc_date).setMonth(new Date(p.pc_date).getMonth()+(+p.dlp_months||12))); const d=daysLeft(rel); if(d!=null&&d<=30&&d>-60) A.push({lvl:'blue',kind:'Retention release',text:`Apply for retention release – ${p.name}`,sub:`Defects liability period ends ${fmtD(rel)}`,go:['project',p.id],sort:25}); });
  S.plant.forEach(x=>{ [['service',x.service_due],['insurance / licence',x.insurance_expiry],['safety inspection',x.inspection_due]].forEach(([k,v])=>{ const d=daysLeft(v); if(d!=null&&d<=7) A.push({lvl:d<0?'bad':'warn',kind:'Plant',text:`${x.name}: ${k} ${d<0?'overdue':'due '+fmtD(v)}`,sub:x.project_id?projName(x.project_id):'Yard',go:['route','plant'],sort:18}); }); });
}

  else if(k==='edit') annEditor(byId('announcements',id));
  else if(k==='seen') annSeenBox(id);
  else if(k==='del'){ const a=byId('announcements',id); if(a&&await confirmBox(`Remove the announcement "${a.title}"? It disappears for everyone.`,'Remove',true)){ await remove('announcements',id); toast('Announcement removed.'); } }
}, true);
document.addEventListener('click',e=>{ const q=e.target.closest('[data-askq]'); if(q){ e.stopPropagation(); askSend(q.dataset.askq); return; }
  const c=e.target.closest('[data-askcopy]'); if(c){ e.stopPropagation(); const m=UI.chat[+c.dataset.askcopy]; if(m){ (navigator.clipboard?navigator.clipboard.writeText(m.content):Promise.reject()).then(()=>toast('Copied.')).catch(()=>toast('Copy not allowed here – select the text instead.')); } } },true);
document.addEventListener('click',e=>{ const g=e.target.closest('[data-go-proj]'); if(!g) return; e.stopPropagation(); UI.ptabw='programme'; go('project',g.dataset.goProj); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&ANN.showing){ ANN.later.add(ANN.showing); annClose(); } });
/* ---------- open a page from a notification ---------- */
window.NX_OPEN=op=>{ op=String(op||''); const [k,v]=op.split(/:(.+)/);
  if(k==='alerts'){ nsOpened(); openDrawer('alerts'); }
  else if(k==='logins'){ if(window.NX_OPEN_USERS) window.NX_OPEN_USERS(); else go('settings'); }
  else if(k==='ann'&&v){ go('home'); let n=0; const t=setInterval(()=>{ if(byId('announcements',v)){ clearInterval(t); annShow(v,1); } else if(++n>40) clearInterval(t); },250); }
  else if(k==='chat'){ go('chat'); if(v){ let n=0; const t=setInterval(()=>{ if((window.NX_CHAT_OPEN&&window.NX_CHAT_OPEN(v))||++n>40) clearInterval(t); },250); } }
  else if(k==='rec'&&v){ go('records'); let n=0; const t=setInterval(()=>{ if(byId('records',v)){ clearInterval(t); openDrawer('rec',v); } else if(++n>40) clearInterval(t); },250); }
  else if(k==='tender'&&v){ go('tenders'); let n=0; const t=setInterval(()=>{ if(byId('tenders',v)){ clearInterval(t); openTender(v); } else if(++n>40) clearInterval(t); },250); }
  else if(PAGE_FN[k]) go(k);
};
/* ===================== START ===================== */
(async function start(){
  try{ UI.theme=localStorage.getItem('nx_theme')||'System';  }catch(_){}
  try{ UI.photos=localStorage.getItem('nx_photos')||'On'; }catch(_){} applyPhotos();
  applyTheme(); renderAll();
  try{ if(window.NX_READY) await window.NX_READY; }catch(_){ return; }
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,user,sample,assets,downloads]=await Promise.all([use('db'),use('user'),use('sample'),use('assets'),use('downloads')]);
  if(user){ try{ me=await user.me(); isAdmin=!!(await user.canEdit()); isFin=!!(await user.isFinance?.()); const cw=await user.can('data.write'); canWrite=cw!==false; }catch(_){}
    $('#meName').textContent=me.name||''; $('#meAv').innerHTML=me.avatarUrl?`<img alt="" src="${esc(me.avatarUrl)}">`:esc(initials(me.name||'You')); }
  nsLoad(); window.NX_READY?window.NX_READY.then(annInit).catch(()=>{}):annInit();
  $('#syncState').textContent=db?'Live · synced':'Offline preview';
  if(!db){ renderAll(); return; }
  const onErr=c=>err=>{ console.warn(c,err); loaded.add(c); renderAll(); };
  for(const c of COLS){ db.collection(c).limit(1000).onSnapshot(s=>{ S[c]=s.docs.map(d=>({id:d.id,...d.data()})); if(c==='projects'){ S.projectsAll=S[c]; S[c]=S[c].filter(p=>!p.deleted); } loaded.add(c); renderAll(); }, onErr(c)); }
  db.doc('system/sync').onSnapshot(s=>{ S.sync=s.exists?s.data():null; renderAll(); }, ()=>{});
  db.doc('imports/last').onSnapshot(s=>{ S.lastImport=s.exists?s.data():null; renderAll(); }, ()=>{});
  db.doc('system/backup').onSnapshot(s=>{ S.backup=s.exists?s.data():null; renderAll(); }, ()=>{});
  db.doc('system/recipients').onSnapshot(s=>{ S.recip=s.exists?s.data():null; renderAll(); }, ()=>{});
  db.doc('settings/company').onSnapshot(s=>{ S.company=s.exists?s.data():null; renderAll(); }, ()=>{});
  db.doc('activity/'+new Date().toISOString().slice(0,7)).onSnapshot(s=>{ S.activity=s.exists?(s.data().entries||[]):[]; if(route==='settings') renderAll(); }, ()=>{});
  { const op=new URLSearchParams(location.search).get('open'); if(op){ try{ history.replaceState(null,'',location.pathname); }catch(_){} setTimeout(()=>window.NX_OPEN(op),1200); } }
})();
